<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《再见：太宰治的孤独世界》资源分享</title>
<style>
    :root {
        --baidu: #2932e1;
        --quark: #5b6cf9;
        --xunlei: #12a0ff;
        --text: #1f2329;
        --muted: #8a9099;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        padding: 48px 20px 64px;
        font-family: "微软雅黑", "PingFang SC", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, #eef2ff 0%, #f7f9fc 45%, #eaf6ff 100%);
        -webkit-font-smoothing: antialiased;
    }

    .wrap {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
    }

    header {
        text-align: center;
        margin-bottom: 40px;
    }

    header h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    header .sub {
        margin-top: 10px;
        font-size: 15px;
        color: var(--muted);
    }

    .cards {
        display: grid;
        gap: 18px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        padding: 22px 24px;
        border: 1px solid rgba(0, 0, 0, .05);
        box-shadow: 0 6px 20px rgba(31, 35, 41, .07);
        transition: transform .18s ease, box-shadow .18s ease;
    }

    .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(31, 35, 41, .12);
    }

    .head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
    }

    .logo {
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        letter-spacing: 1px;
    }

    .card.baidu .logo  { background: linear-gradient(135deg, #2b5cff, var(--baidu)); }
    .card.quark .logo  { background: linear-gradient(135deg, #7a86ff, var(--quark)); }
    .card.xunlei .logo { background: linear-gradient(135deg, #45b8ff, var(--xunlei)); }

    .title { font-size: 18px; font-weight: 600; }

    .pw {
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
    }

    .pw b {
        color: var(--text);
        font-weight: 600;
        letter-spacing: 1px;
    }

    .btn {
        display: block;
        padding: 13px 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        transition: filter .18s ease, transform .18s ease;
    }

    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .card.baidu .btn  { background: var(--baidu); }
    .card.quark .btn  { background: var(--quark); }
    .card.xunlei .btn { background: var(--xunlei); }

    .tip {
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--muted);
    }

    footer {
        margin-top: 36px;
        text-align: center;
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.8;
    }

    @media (max-width: 520px) {
        body { padding: 32px 14px 48px; }
        header h1 { font-size: 23px; }
        .card { padding: 18px; border-radius: 14px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>资源分享</h1>
        <p class="sub">《再见：太宰治的孤独世界》</p>
    </header>

    <div class="cards">
        <!-- ① 百度网盘 -->
        <article class="card baidu">
            <div class="head">
                <div class="logo">百度</div>
                <div>
                    <div class="title">百度网盘</div>
                    <div class="pw">提取码：<b>nbZf</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.baidu.com/s/1NFVwW1pX__RNHblOxkgVyQ" target="_blank" rel="noopener noreferrer">点击跳转百度网盘</a>
            <p class="tip">打开后输入提取码 nbZf 即可保存，链接与提取码长期有效。</p>
        </article>

        <!-- ② 夸克网盘 -->
        <article class="card quark">
            <div class="head">
                <div class="logo">夸克</div>
                <div>
                    <div class="title">夸克网盘</div>
                    <div class="pw">无需提取码，打开即可保存</div>
                </div>
            </div>
            <a class="btn" href="https://pan.quark.cn/s/39aec18ac4f9" target="_blank" rel="noopener noreferrer">点击跳转夸克网盘</a>
        </article>

        <!-- ③ 迅雷云盘 -->
        <article class="card xunlei">
            <div class="head">
                <div class="logo">迅雷</div>
                <div>
                    <div class="title">迅雷云盘</div>
                    <div class="pw">提取码：<b>9x8j</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.xunlei.com/s/VP6XM1yIMw9NJ0ilaaQ7XFJgA1?pwd=9x8j" target="_blank" rel="noopener noreferrer">点击跳转迅雷云盘</a>
        </article>
    </div>

    <footer>
        三个网盘内容一致，任选其一保存即可。<br>
        若链接失效，请在原分享处反馈。
    </footer>
</div>
</body>
</html>
