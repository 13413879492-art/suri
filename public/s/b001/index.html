<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>再见太宰治的孤独世界 资源分享</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
    <header>
        <h1>再见太宰治的孤独世界</h1>
        <p class="sub">太宰治作品资源</p>
    </header>

    <div class="cards">
        <article class="card baidu">
            <div class="head">
                <div class="logo">百度</div>
                <div>
                    <div class="title">百度网盘</div>
                    <div class="pw">提取码：<b>nbZf</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.baidu.com/s/1NFVwW1pX__RNHblOxkgVyQ?pwd=nbZf" target="_blank" rel="noopener noreferrer">点击跳转百度网盘</a>
            <p class="tip">打开后输入提取码 nbZf 即可保存。</p>
        </article>
        <article class="card quark">
            <div class="head">
                <div class="logo">夸克</div>
                <div>
                    <div class="title">夸克网盘</div>
                    <div class="pw">无需提取码，打开即可保存</div>
                </div>
            </div>
            <a class="btn" href="https://pan.quark.cn/s/35569c4b4c09" target="_blank" rel="noopener noreferrer">点击跳转夸克网盘</a>
            <p class="tip">点击即可跳转，无需提取码。</p>
        </article>
        <article class="card xunlei">
            <div class="head">
                <div class="logo">迅雷</div>
                <div>
                    <div class="title">迅雷云盘</div>
                    <div class="pw">提取码：<b>3uz6</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.xunlei.com/s/VP6yFWN1bY66XtGk0jgEXA1?pwd=3uz6" target="_blank" rel="noopener noreferrer">点击跳转迅雷云盘</a>
            <p class="tip">打开后输入提取码 3uz6 即可保存。</p>
        </article>

    </div>

    <footer>
        <a href="../">← 返回资源目录</a>
    </footer>
</div>
</body>
</html>
