<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>死亡回忆 濒死体验访谈录 资源分享</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
    <header>
        <h1>死亡回忆 濒死体验访谈录</h1>
        <p class="sub">濒死体验研究经典</p>
    </header>

    <div class="cards">
        <article class="card baidu">
            <div class="head">
                <div class="logo">百度</div>
                <div>
                    <div class="title">百度网盘</div>
                    <div class="pw">提取码：<b class="pw-code" data-code="V165" title="点击复制">V165</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.baidu.com/s/1FC6ObCVOWIAo7APU5l0Vig?pwd=V165" target="_blank" rel="noopener noreferrer">点击跳转百度网盘</a>
            <p class="tip">点按钮会直接打开并自动填好提取码（没自动填就点一下上面的码复制）。</p>
        </article>
        <article class="card xunlei">
            <div class="head">
                <div class="logo">迅雷</div>
                <div>
                    <div class="title">迅雷云盘</div>
                    <div class="pw">提取码：<b class="pw-code" data-code="a5dd" title="点击复制">a5dd</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.xunlei.com/s/VP719bsHSJrCO8RSykDWdF52A1?pwd=a5dd" target="_blank" rel="noopener noreferrer">点击跳转迅雷云盘</a>
            <p class="tip">点按钮会直接打开并自动填好提取码（没自动填就点一下上面的码复制）。</p>
        </article>

    </div>

    <footer>
        <a href="../">← 返回资源目录</a>
    </footer>
</div>
<script src="../copy.js" defer></script>
</body>
</html>
