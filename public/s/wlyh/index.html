<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围炉夜话 资源分享</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
    <header>
        <h1>围炉夜话</h1>
        <p class="sub">清·王永彬｜221则冬夜围炉的家常话</p>
    </header>

    <div class="cards">
        <article class="card baidu">
            <div class="head">
                <div class="logo">百度</div>
                <div>
                    <div class="title">百度网盘</div>
                    <div class="pw">提取码：<b class="pw-code" data-code="473q" title="点击复制">473q</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.baidu.com/s/15wyLdSheE_hmcS_19F5oLA?pwd=473q" target="_blank" rel="noopener noreferrer">点击跳转百度网盘</a>
            <p class="tip">点按钮会直接打开并自动填好提取码（没自动填就点一下上面的码复制）。</p>
        </article>
        <article class="card xunlei">
            <div class="head">
                <div class="logo">迅雷</div>
                <div>
                    <div class="title">迅雷云盘</div>
                    <div class="pw">提取码：<b class="pw-code" data-code="kaft" title="点击复制">kaft</b></div>
                </div>
            </div>
            <a class="btn" href="https://pan.xunlei.com/s/VP71ZDobBqqflU_DH3xJ8UbZA1?pwd=kaft" target="_blank" rel="noopener noreferrer">点击跳转迅雷云盘</a>
            <p class="tip">点按钮会直接打开并自动填好提取码（没自动填就点一下上面的码复制）。</p>
        </article>

    </div>

    <footer>
        公版古籍整理，仅供个人学习交流。<br>
        <a href="../">← 返回资源目录</a>
    </footer>
</div>
<script src="../copy.js" defer></script>
</body>
</html>
